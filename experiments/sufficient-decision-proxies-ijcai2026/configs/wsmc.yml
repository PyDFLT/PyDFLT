model:
  name: WSMC_Schutte2026

data:
  name: 'wsmc'
  num_data: 100 # TODO adjust
  num_items: 5

runner:
  num_epochs: 5 # TODO adjust
  use_wandb: true
  project_name: wsmc_ijcai2026
  experiment_name: experiment
  main_metric: abs_regret
  save_best: true
  experiments_folder: 'results/'
  store_min_and_max: true
  val_metrics: ['objective', 'abs_regret', 'rel_regret', 'sym_rel_regret']

problem:
  train_ratio: 0.4
  val_ratio: 0.1
  compute_optimal_objectives: true
  compute_optimal_decisions: true
  standardize_features: true

decision_maker:
  name: sfge
  standardize_predictions: true
  learning_rate: 0.0005
  predictor_str: MLP
  decision_model_str: 'base'
  predictor_kwargs:
    size: 256
    num_hidden_layers: 2

