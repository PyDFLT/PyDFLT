_keys_with_randomization: ['runner', 'problem', 'decision_maker']

model:
  name: portfolio_ln_Schutte2026

data:
  name: load_data_from_npz

runner:
  num_epochs: 250
  use_wandb: true
  project_name: portfolio_ijcai2026
  experiment_name: experiment
  experiments_folder: 'results/'
  main_metric: abs_regret
  save_best: true
  store_min_and_max: true
  val_metrics: ['objective', 'abs_regret', 'rel_regret', 'sym_rel_regret']
  test_metrics: ['objective', 'abs_regret', 'rel_regret', 'sym_rel_regret']

problem:
  train_ratio: 0.7
  val_ratio: 0.15
  compute_optimal_objectives: true
  compute_optimal_decisions: true
  standardize_features: true
  time_respecting_split: true

decision_maker:
  name: differentiable
  learning_rate: 0.00005
  loss_function_str: regret
  standardize_predictions: true
  predictor_str: MLP
  predictor_kwargs:
    size: 256
    num_hidden_layers: 2

method_overrides:
  # We do not standardize predictions for point approaches as we determine bank return based on non-standardized values
  point:
    decision_maker:
      standardize_predictions: false
  2_point:
    decision_maker:
      standardize_predictions: false
  8_point:
    decision_maker:
      standardize_predictions: false
  16_point:
    decision_maker:
      standardize_predictions: false
